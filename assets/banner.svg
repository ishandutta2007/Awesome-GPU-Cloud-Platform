<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1">
        <animate attributeName="stop-color" values="#4facfe;#00f2fe;#4facfe" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#00f2fe" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" rx="15" />
  <text x="50%" y="45%" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle" alignment-baseline="middle">
    Awesome GPU Cloud Platform
  </text>
  <text x="50%" y="65%" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" text-anchor="middle" alignment-baseline="middle" opacity="0.9">
    Your ultimate guide to the best GPU-as-a-Service
  </text>
  <circle cx="50" cy="50" r="10" fill="#ffffff" opacity="0.3">
    <animate attributeName="cy" values="50;30;50" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="750" cy="150" r="15" fill="#ffffff" opacity="0.3">
    <animate attributeName="cy" values="150;170;150" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>
